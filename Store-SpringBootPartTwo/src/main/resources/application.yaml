spring:
  application:
    name: store-springboot-part-two

  jwt:
    secret: ${JWT_SECRET}

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/store_api?createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration
